name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Each OS has its own process backend: cgo + libproc on macOS, /proc and
    # netlink on Linux. Both have to be built and tested natively.
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./cmd/ghosts
