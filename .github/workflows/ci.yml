name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # cgo uses macOS-only APIs (libproc), so this can only build on macOS.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./cmd/ghosts
