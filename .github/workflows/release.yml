name: Release

# Push a tag like v0.1.0 to build a universal binary, publish a GitHub
# release, and update the formula in xamjiang/homebrew-tap.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    env:
      CGO_ENABLED: "1"
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test
        run: |
          go vet ./...
          go test ./...

      - name: Build universal binary
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          LDFLAGS="-s -w -X main.version=${VERSION}"
          GOARCH=arm64 CC="clang -arch arm64" go build -trimpath -ldflags "$LDFLAGS" -o dist/arm64/ghosts ./cmd/ghosts
          GOARCH=amd64 CC="clang -arch x86_64" go build -trimpath -ldflags "$LDFLAGS" -o dist/amd64/ghosts ./cmd/ghosts
          mkdir -p dist/pkg
          lipo -create -output dist/pkg/ghosts dist/arm64/ghosts dist/amd64/ghosts
          dist/pkg/ghosts -version | grep -qx "ghosts ${VERSION}"
          cp LICENSE README.md dist/pkg/
          ARCHIVE="ghosts_${VERSION}_darwin_universal.tar.gz"
          tar -C dist/pkg -czf "dist/${ARCHIVE}" ghosts LICENSE README.md
          (cd dist && shasum -a 256 "${ARCHIVE}" > checksums.txt)
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "ARCHIVE=${ARCHIVE}" >> "$GITHUB_ENV"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "dist/${ARCHIVE}" dist/checksums.txt --generate-notes --verify-tag

      - name: Update Homebrew tap
        env:
          # Fine-grained token with "Contents: read and write" on homebrew-tap.
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          SHA256="$(cut -d' ' -f1 dist/checksums.txt)"
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/${GITHUB_REPOSITORY_OWNER}/homebrew-tap.git" tap
          mkdir -p tap/Formula
          sed -e "s/@VERSION@/${VERSION}/g" -e "s/@SHA256@/${SHA256}/g" packaging/ghosts.rb.tmpl > tap/Formula/ghosts.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/ghosts.rb
          git commit -m "ghosts ${VERSION}"
          git push
