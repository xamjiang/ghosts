name: Release

# Push a tag like v0.6.0 to build macOS and Linux binaries, .deb packages and
# the signed APT index, publish them as a GitHub release (which is what
# ghosts.xamjiang.com/apt serves), and update the formula in
# xamjiang/homebrew-tap.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    # cgo + libproc: has to build on macOS.
    runs-on: macos-latest
    env:
      CGO_ENABLED: "1"
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test
        run: |
          go vet ./...
          go test ./...

      - name: Build universal binary
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          LDFLAGS="-s -w -X main.version=${VERSION}"
          GOARCH=arm64 CC="clang -arch arm64" go build -trimpath -ldflags "$LDFLAGS" -o build/arm64/ghosts ./cmd/ghosts
          GOARCH=amd64 CC="clang -arch x86_64" go build -trimpath -ldflags "$LDFLAGS" -o build/amd64/ghosts ./cmd/ghosts
          mkdir -p build/pkg dist
          lipo -create -output build/pkg/ghosts build/arm64/ghosts build/amd64/ghosts
          build/pkg/ghosts -version | grep -qx "ghosts ${VERSION}"
          cp LICENSE README.md build/pkg/
          tar -C build/pkg -czf "dist/ghosts_${VERSION}_darwin_universal.tar.gz" ghosts LICENSE README.md

      - uses: actions/upload-artifact@v7
        with:
          name: dist-macos
          path: dist/

  linux:
    # No cgo on Linux, so both architectures cross-compile here.
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test
        run: |
          go vet ./...
          go test ./...

      - name: Build binaries and packages
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          LDFLAGS="-s -w -X main.version=${VERSION}"
          mkdir -p dist
          for ARCH in amd64 arm64; do
            mkdir -p "build/${ARCH}"
            GOARCH="$ARCH" go build -trimpath -ldflags "$LDFLAGS" -o "build/${ARCH}/ghosts" ./cmd/ghosts
            cp LICENSE README.md "build/${ARCH}/"
            tar -C "build/${ARCH}" -czf "dist/ghosts_${VERSION}_linux_${ARCH}.tar.gz" ghosts LICENSE README.md
            # Versionless name, so releases/latest/download/… always works.
            packaging/deb.sh "$VERSION" "$ARCH" "build/${ARCH}/ghosts" "dist/ghosts_linux_${ARCH}.deb"
          done
          build/amd64/ghosts -version | grep -qx "ghosts ${VERSION}"

      - name: Sign the APT repository index
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          sudo apt-get install -y -qq apt-utils >/dev/null
          echo "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          packaging/apt-repo.sh build/apt dist/*.deb
          # Release assets are flat; the Worker maps ghosts.xamjiang.com/apt/…
          # paths onto these names.
          idx=build/apt/dists/stable
          for f in InRelease Release Release.gpg; do cp "$idx/$f" "dist/apt_$f"; done
          for arch in amd64 arm64; do
            cp "$idx/main/binary-$arch/Packages" "dist/apt_Packages_$arch"
            cp "$idx/main/binary-$arch/Packages.gz" "dist/apt_Packages_$arch.gz"
          done

      - uses: actions/upload-artifact@v7
        with:
          name: dist-linux
          path: dist/

  release:
    needs: [macos, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum -- ghosts_* > checksums.txt
          cat checksums.txt
          # Publish only once every asset is uploaded: the APT index of a
          # half-uploaded "latest" release would point at missing files.
          gh release create "$GITHUB_REF_NAME" --draft --generate-notes --verify-tag -- *
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest

      - name: Update Homebrew tap
        env:
          # Fine-grained token with "Contents: read and write" on homebrew-tap.
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sha() { grep " ghosts_${VERSION}_$1.tar.gz\$" dist/checksums.txt | cut -d' ' -f1; }
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/${GITHUB_REPOSITORY_OWNER}/homebrew-tap.git" tap
          mkdir -p tap/Formula
          sed -e "s/@VERSION@/${VERSION}/g" \
              -e "s/@SHA256_DARWIN@/$(sha darwin_universal)/" \
              -e "s/@SHA256_LINUX_AMD64@/$(sha linux_amd64)/" \
              -e "s/@SHA256_LINUX_ARM64@/$(sha linux_arm64)/" \
              packaging/ghosts.rb.tmpl > tap/Formula/ghosts.rb
          if grep -nE '@[A-Z0-9_]+@|sha256 ""' tap/Formula/ghosts.rb; then echo "formula is incomplete"; exit 1; fi
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/ghosts.rb
          git commit -m "ghosts ${VERSION}"
          git push

