name: Worker

# Deploy ghosts.xamjiang.com when the Worker, or the install script and images
# it serves, change.
on:
  push:
    branches: [main]
    paths: ["worker/**", "packaging/install.sh", "docs/images/**"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v7
      - name: Deploy
        working-directory: worker
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN isn't set; deploy by hand with: cd worker && npx wrangler@4.137.0 deploy"
            exit 0
          fi
          npx --yes wrangler@4.137.0 deploy
