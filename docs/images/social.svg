<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
<!-- The link preview for the website and the GitHub repository: the banner's
     art, laid out for 2:1 and without animation. social.png is rendered
     from this file. -->
<style>
.sans{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI","PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
.mono{font-family:"SF Mono",SFMono-Regular,ui-monospace,Menlo,Consolas,monospace}
</style>
<defs>
  <radialGradient id="glow" cx="330" cy="320" r="340" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#0A84FF" stop-opacity=".45"/>
    <stop offset=".45" stop-color="#5E5CE6" stop-opacity=".16"/>
    <stop offset="1" stop-color="#5E5CE6" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glow2" cx="1180" cy="40" r="560" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#BF5AF2" stop-opacity=".18"/>
    <stop offset="1" stop-color="#BF5AF2" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFFFFF"/>
    <stop offset=".7" stop-color="#E9ECFF"/>
    <stop offset="1" stop-color="#C9D2FF" stop-opacity=".55"/>
  </linearGradient>
  <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#FFFFFF"/>
    <stop offset="1" stop-color="#B8C4FF"/>
  </linearGradient>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1" fill="#FFFFFF" fill-opacity=".07"/>
  </pattern>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
    <feGaussianBlur stdDeviation="18"/>
  </filter>
</defs>

<rect width="1280" height="640" fill="#0B0B10"/>
<rect width="1280" height="640" fill="url(#dots)"/>
<rect width="1280" height="640" fill="url(#glow2)"/>
<circle cx="330" cy="320" r="340" fill="url(#glow)"/>

<!-- Ports the ghost left behind -->
<g class="mono" font-size="22">
  <g opacity=".85"><rect x="88" y="150" width="94" height="38" rx="19" fill="#1C1C22" stroke="#3A3A44"/><text x="135" y="176" fill="#8E8EA0" text-anchor="middle">:3000</text></g>
  <g opacity=".85"><rect x="470" y="128" width="94" height="38" rx="19" fill="#1C1C22" stroke="#3A3A44"/><text x="517" y="154" fill="#8E8EA0" text-anchor="middle">:5173</text></g>
  <g opacity=".85"><rect x="494" y="410" width="94" height="38" rx="19" fill="#1C1C22" stroke="#3A3A44"/><text x="541" y="436" fill="#8E8EA0" text-anchor="middle">:8000</text></g>
  <g opacity=".85"><rect x="64" y="420" width="94" height="38" rx="19" fill="#1C1C22" stroke="#3A3A44"/><text x="111" y="446" fill="#8E8EA0" text-anchor="middle">:5432</text></g>
</g>

<!-- The ghost, the banner's at 1.35× -->
<g transform="translate(330 320) scale(1.35) translate(-300 -200)">
  <ellipse cx="300" cy="344" rx="70" ry="9" fill="#000" opacity=".5"/>
  <path d="M220 170a80 80 0 0 1 160 0v120q-20-24-40 0q-20 24-40 0q-20-24-40 0q-20 24-40 0z" fill="#8FA4FF" opacity=".55" filter="url(#soft)"/>
  <path d="M220 170a80 80 0 0 1 160 0v120q-20-24-40 0q-20 24-40 0q-20-24-40 0q-20 24-40 0z" fill="url(#body)"/>
  <ellipse cx="272" cy="186" rx="12" ry="16" fill="#14141C"/>
  <ellipse cx="328" cy="186" rx="12" ry="16" fill="#14141C"/>
  <circle cx="276" cy="180" r="4" fill="#FFFFFF"/>
  <circle cx="332" cy="180" r="4" fill="#FFFFFF"/>
  <ellipse cx="250" cy="216" rx="11" ry="6" fill="#FF7AA8" opacity=".35"/>
  <ellipse cx="350" cy="216" rx="11" ry="6" fill="#FF7AA8" opacity=".35"/>
  <ellipse cx="300" cy="222" rx="8" ry="9" fill="#14141C"/>
</g>

<!-- Wordmark -->
<text class="sans" x="664" y="262" font-size="136" font-weight="800" letter-spacing="-4" fill="url(#word)">Ghosts</text>
<text class="sans" x="670" y="330" font-size="40" font-weight="600" fill="#E5E5EA">Find the dev servers</text>
<text class="sans" x="670" y="380" font-size="40" font-weight="600" fill="#E5E5EA">you forgot to stop.</text>
<g class="mono" font-size="18" fill="#A1A1AA">
  <rect x="670" y="418" width="94" height="36" rx="18" fill="#FFFFFF" fill-opacity=".06" stroke="#FFFFFF" stroke-opacity=".12"/>
  <text x="717" y="442" text-anchor="middle">macOS</text>
  <rect x="776" y="418" width="94" height="36" rx="18" fill="#FFFFFF" fill-opacity=".06" stroke="#FFFFFF" stroke-opacity=".12"/>
  <text x="823" y="442" text-anchor="middle">Linux</text>
  <rect x="882" y="418" width="104" height="36" rx="18" fill="#FFFFFF" fill-opacity=".06" stroke="#FFFFFF" stroke-opacity=".12"/>
  <text x="934" y="442" text-anchor="middle">Docker</text>
</g>
<text class="mono" x="670" y="540" font-size="22" fill="#8E8E93">ghosts.xamjiang.com</text>
</svg>
