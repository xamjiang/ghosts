# ghosts.xamjiang.com: the install script and the APT repository.
# Deploy with: npx wrangler@4.137.0 deploy (from this directory)
name = "ghosts"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = false

routes = [{ pattern = "ghosts.xamjiang.com", custom_domain = true }]

# The install script, landing page, its images and the APT public key are
# bundled into the Worker, so they are served from the edge with no origin
# fetch.
rules = [
  { type = "Text", globs = ["**/*.sh", "**/*.html", "**/*.svg", "**/*.asc"], fallthrough = true },
  { type = "Data", globs = ["**/*.gpg", "**/*.png"], fallthrough = true },
]

# The APT index and packages are assets of the GitHub releases.
[vars]
RELEASES = "https://github.com/xamjiang/ghosts/releases"
